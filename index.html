    <!-- Boot loader: pure CSS, replaced automatically when React renders into #root -->
    <style>
        html, body { background: #050508; margin: 0; }
        #boot {
            position: fixed; inset: 0; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
            background: #050508; font-family: 'JetBrains Mono', monospace;
        }
        .boot-strand { display: flex; gap: 10px; height: 44px; align-items: center; }
        .boot-strand i {
            width: 8px; height: 8px; border-radius: 50%;
            animation: bootWave 1.1s ease-in-out infinite;
        }
        .boot-strand i:nth-child(odd)  { background: #38bdf8; box-shadow: 0 0 12px #38bdf8; }
        .boot-strand i:nth-child(even) { background: #a855f7; box-shadow: 0 0 12px #a855f7; }
        .boot-strand i:nth-child(1) { animation-delay: 0s; }
        .boot-strand i:nth-child(2) { animation-delay: .12s; }
        .boot-strand i:nth-child(3) { animation-delay: .24s; }
        .boot-strand i:nth-child(4) { animation-delay: .36s; }
        .boot-strand i:nth-child(5) { animation-delay: .48s; }
        .boot-strand i:nth-child(6) { animation-delay: .6s; }
        .boot-strand i:nth-child(7) { animation-delay: .72s; }
        .boot-strand i:nth-child(8) { animation-delay: .84s; }
        @keyframes bootWave {
            0%, 100% { transform: translateY(-12px) scale(.8); opacity: .5; }
            50%      { transform: translateY(12px) scale(1.15); opacity: 1; }
        }
        .boot-text {
            color: rgba(255,255,255,.35); font-size: 10px; font-weight: 700;
            letter-spacing: .55em; text-transform: uppercase; padding-left: .55em;
            animation: bootPulse 1.6s ease-in-out infinite;
        }
        @keyframes bootPulse { 0%,100% { opacity: .35; } 50% { opacity: .9; } }
        @media (prefers-reduced-motion: reduce) {
            .boot-strand i, .boot-text { animation: none; }
        }
    </style>
</head>

<body>
    <div id="root">
        <div id="boot">
            <div class="boot-strand"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
            <p class="boot-text">Sequencing genome</p>
        </div>
    </div>
